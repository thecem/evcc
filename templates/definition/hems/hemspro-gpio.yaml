template: hemspro-gpio
products:
  - brand: Awatt Electronic
    description:
      generic: HEMS PRO (FNN-Schaltkontakte)
params:
  - name: maxconsumptionpower
    type: float
    unit: W
    required: true
    description:
      en: Guaranteed minimum power (Pmin)
      de: Garantierte Mindestleistung (Pmin)
    help:
      en: Power limit applied to the root circuit while the limit is active.
      de: Leistungsbegrenzung des Hauptstromkreises während die Limitierung aktiv ist.
  - name: maxproductionpower
    type: float
    unit: W
    required: true
    description:
      en: Installed generator power (Wp)
      de: Installierte Generatorleistung (Wp)
    help:
      en: Rated generator/module power (Wp) of the installation.
      de: Gesamtnennleistung bzw. Modul- oder Generatorleistung der Anlage (Bezugsgröße nach § 9 EEG).
  - name: failsafeconsumptionpower
    type: float
    unit: W
    advanced: true
    description:
      en: Failsafe consumption limit
      de: Failsafe-Bezugsgrenze
    help:
      en: Consumption limit applied if reading W4 fails.
      de: Bezugsgrenze, die angewendet wird, wenn W4 nicht gelesen werden kann.
  - name: failsafeproductionpower
    type: float
    unit: W
    advanced: true
    description:
      en: Failsafe production limit
      de: Failsafe-Einspeisebegrenzung
    help:
      en: Feed-in limit applied if reading the curtailment inputs fails.
      de: Einspeisebegrenzung, die angewendet wird, wenn die Curtailment-Eingänge nicht gelesen werden können.
  - name: failsafeduration
    type: duration
    advanced: true
    description:
      en: Failsafe minimum duration
      de: Failsafe-Mindestdauer
    help:
      en: Minimum time the failsafe limit stays active once entered.
      de: Mindestdauer, für die der Failsafe-Wert nach Aktivierung gehalten wird.
render: |
  type: fnn
  maxdimpower: {{ .maxconsumptionpower }}
  {{- if .failsafeconsumptionpower }}
  failsafeconsumptionactivepowerlimit: {{ .failsafeconsumptionpower }}
  {{- end }}
  w4:
    source: gpio
    pin: 13
    function: read
  maxcurtailpower: {{ .maxproductionpower }}
  {{- if .failsafeproductionpower }}
  failsafeproductionactivepowerlimit: {{ .failsafeproductionpower }}
  {{- end }}
  {{- if .failsafeduration }}
  failsafedurationminimum: {{ .failsafeduration }}
  {{- end }}
  w3:
    source: gpio
    pin: 5
    function: read
  s1:
    source: gpio
    pin: 17
    function: read
  s2:
    source: gpio
    pin: 27
    function: read
